[package]
name = "grasp-desktop"
version = "0.1.0"
edition = "2021"
description = "Grasp for Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
arboard = "3"
async-trait = "0.1"
grasp-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time"] }
# Explorer's Send to entry is a .lnk; Send clipboard turns a copied image into a PNG.
mslnk = "0.1"
png = "0.17"

[target.'cfg(windows)'.dependencies]
# Drag detection (dragwatch.rs) and local time for screenshot names.
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
# The toast's own OLE drop target (droptarget.rs). Same version and features wry already builds.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"   # needed by windows' #[implement] macro
