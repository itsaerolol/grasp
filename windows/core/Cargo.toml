[package]
name = "grasp-core"
version = "0.1.0"
edition = "2021"
description = "LocalSend v2 receiver for Grasp for Windows. No UI: the shell plugs in through the `Ui` trait."

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
futures-util = "0.3"
hex = "0.4"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false }
tower = { version = "0.5", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "sync", "time", "net"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "grasp-headless"
path = "src/bin/headless.rs"
