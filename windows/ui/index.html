<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grasp</title>
<style>
  /* Always dark, regardless of the Windows theme. */
  :root {
    color-scheme: dark;
    --card: rgba(38, 38, 40, 0.97);
    --border: rgba(255, 255, 255, 0.1);
    --text: #f5f5f7;
    --text-2: #a1a1a6;
    --fill: rgba(235, 235, 245, 0.16);
    --fill-hover: rgba(235, 235, 245, 0.26);
    --track: rgba(235, 235, 245, 0.18);
    --accent: #0a84ff;
    --accent-hover: #2b95ff;
    --reject: #8f3a36;         /* muted red: clearly "no", not alarming */
    --reject-hover: #a24742;
    --ok: #30d158;
    --bad: #ff6a61;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; }
  body {
    font: 14px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  /* The transparent margin around the card holds its shadow. It must be at least as big as the
     shadow, or the window edge slices the shadow off and leaves a visible dark rectangle.
     Shadow reach: 16px sides, ~10px top, ~22px bottom. */
  .stage { padding: 14px 22px 30px 22px; }

  #card {
    width: 360px;
    padding: 14px 16px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.30), 0 1px 3px rgba(0, 0, 0, 0.30);
    transform: translateX(calc(100% + 48px));
    opacity: 0;
    transition: transform 520ms cubic-bezier(0.16, 1, 0.3, 1), opacity 220ms ease-out;
  }
  #card.in { transform: translateX(0); opacity: 1; }
  #card.out {
    transform: translateX(calc(100% + 48px)); opacity: 0;
    transition: transform 280ms cubic-bezier(0.5, 0, 0.9, 0.4), opacity 240ms ease-in;
  }
  #card.clickable { cursor: pointer; }

  .row { display: flex; align-items: center; gap: 12px; }
  .glyph { flex: none; width: 40px; height: 40px; display: grid; place-items: center; }
  .glyph svg, .glyph img { width: 40px; height: 40px; display: block; }
  .text { min-width: 0; flex: 1; }
  .title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub.wrap { white-space: normal; }

  .actions { display: flex; gap: 8px; margin-top: 14px; }
  button {
    flex: 1; height: 34px; border: 0; border-radius: 17px;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--text);
    background: var(--fill); cursor: pointer;
    transition: background 120ms, transform 120ms;
  }
  button:hover { background: var(--fill-hover); }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-hover); }
  button.reject { background: var(--reject); color: #fff; }
  button.reject:hover { background: var(--reject-hover); }

  .bar { height: 6px; margin-top: 14px; border-radius: 3px; background: var(--track); overflow: hidden; }
  /* Progress bar with its cancel X on the right. */
  .barrow { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .barrow .bar { flex: 1; margin-top: 0; }
  button.stop {
    flex: none; width: 24px; height: 24px; padding: 0; border-radius: 50%;
    font-size: 11px; font-weight: 700; line-height: 24px; color: var(--text-2); background: var(--fill);
  }
  button.stop:hover { background: var(--reject); color: #fff; }
  .bar > i { display: block; height: 100%; width: 0%; border-radius: 3px; background: var(--accent); transition: width 140ms linear; }
  .bar.indeterminate > i { width: 35%; animation: slide 1.1s ease-in-out infinite; }
  .meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }

  .message {
    margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--fill);
    font-size: 14px; max-height: 5.6em; overflow: hidden; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
  }

  /* Windows -> iPhone drop zone: shown while files are dragged anywhere, gone when they're let go elsewhere. */
  .drop {
    margin-top: 12px; height: 96px; border-radius: 14px; border: 2px dashed rgba(235, 235, 245, 0.32);
    display: grid; place-items: center; color: var(--text-2); font-weight: 600;
    transition: border-color 120ms, background 120ms, color 120ms;
  }
  .drop.hover { border-color: var(--accent); background: rgba(10, 132, 255, 0.14); color: var(--text); }

  .check circle { fill: var(--ok); }
  /* pathLength="1" normalises the path, so the dash always spans exactly the whole stroke. */
  .check path { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 380ms 120ms ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .warn circle { fill: var(--bad); }

  @media (prefers-reduced-motion: reduce) {
    #card, #card.out { transition: opacity 150ms linear; transform: none; }
    .bar.indeterminate > i { animation: none; width: 100%; }
  }
</style>
</head>
<body>
<div class="stage"><div id="card" role="alert" aria-live="polite"></div></div>

<script>
'use strict';
const { listen } = window.__TAURI__.event;
const { invoke } = window.__TAURI__.core;
const card = document.getElementById('card');

let current = null;      // what the card is showing: { kind, id, ... }
let queue = [];          // things that arrived while the card was busy
let timer = null;
let leaving = false;
let delivered = { n: 0, last: '' };   // items the phone collected since the last "Sent to iPhone" card

const APP_ICON = `<img src="app-icon.png" alt="" draggable="false">`;
const CHECK = `<svg class="check" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46"/><path pathLength="1" d="M29 52l15 15 28-32"/></svg>`;
const WARN = `<svg class="warn" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46"/><path d="M50 28v28M50 70v2" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"/></svg>`;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmtSize(bytes) {
  if (bytes < 1000) return `${bytes} B`;
  const units = ['KB', 'MB', 'GB', 'TB'];
  let v = bytes, i = -1;
  do { v /= 1000; i++; } while (v >= 1000 && i < units.length - 1);
  return `${v >= 100 ? v.toFixed(0) : v.toFixed(1).replace(/\.0$/, '')} ${units[i]}`;
}

function summarize(files, total) {
  const n = files.length;
  const allImages = files.every((f) => (f.mime || '').startsWith('image/'));
  const what = allImages ? `${n} ${n === 1 ? 'photo' : 'photos'}` : n === 1 ? files[0].name : `${n} files`;
  return `${what} · ${fmtSize(total)}`;
}

// iOS hides the phone's custom name, so "iPhone" is the honest label. Other senders keep their alias.
const who = (req) => (req.deviceModel === 'iPhone' || req.deviceModel === 'iPad' ? req.deviceModel : req.from);

const pctOf = (received, total) => (total ? Math.min(100, Math.floor((received / total) * 100)) : 0);
const sizeLine = (received, total) => (received ? `${fmtSize(received)} of ${fmtSize(total)}` : fmtSize(total));

function markup() {
  const c = current;
  switch (c.kind) {
    case 'incoming': {
      const msg = c.req.message != null;
      const actions = c.accepted ? '' :
        `<div class="actions"><button id="reject" class="reject">Reject</button><button id="accept" class="primary">Accept</button></div>`;
      return `<div class="row"><div class="glyph">${APP_ICON}</div><div class="text">
          <div class="title">${esc(who(c.req))}</div>
          <div class="sub">${msg ? 'Wants to send you a message' : esc(summarize(c.req.files, c.req.total))}</div></div></div>
        ${msg ? `<div class="message">${esc(c.req.message)}</div>` : ''}${actions}`;
    }
    case 'receiving': {
      const pct = pctOf(c.received, c.total);
      return `<div class="row"><div class="glyph">${APP_ICON}</div><div class="text">
          <div class="title">${esc(who(c.req))}</div><div class="sub">Receiving…</div></div></div>
        <div class="barrow"><div class="bar ${c.received ? '' : 'indeterminate'}" id="bar"><i style="width:${pct}%"></i></div>
          <button class="stop" id="stop-receive" title="Cancel and delete what arrived" aria-label="Cancel">✕</button></div>
        <div class="meta"><span id="sz">${sizeLine(c.received, c.total)}</span><span id="pct">${pct}%</span></div>`;
    }
    case 'done':
      return `<div class="row"><div class="glyph">${CHECK}</div><div class="text">
          <div class="title">Received</div><div class="sub">${esc(c.summary)}</div></div></div>`;
    case 'paired':
      return `<div class="row"><div class="glyph">${c.title ? APP_ICON : CHECK}</div><div class="text">
          <div class="title">${esc(c.title ?? 'Paired')}</div><div class="sub">${esc(c.name)}</div></div></div>`;
    case 'copied':
      return `<div class="row"><div class="glyph">${CHECK}</div><div class="text">
          <div class="title">${c.copied ? 'Copied' : 'Couldn’t copy'}${c.opened ? ' · Opened in browser' : ''}</div></div></div>
        <div class="message">${esc(c.text)}</div>`;
    case 'failed':
      return `<div class="row"><div class="glyph">${WARN}</div><div class="text">
          <div class="title">${c.sending ? 'Couldn’t send' : 'Couldn’t receive'}</div><div class="sub wrap">${esc(c.reason)}</div></div></div>`;
    case 'dropzone':
      return `<div class="row"><div class="glyph">${APP_ICON}</div><div class="text">
          <div class="title">Send to iPhone</div><div class="sub">Drop here to send</div></div></div>
        <div class="drop" id="drop">Drop files</div>`;
    case 'queued': {
      const what = c.count === 1 ? c.first : `${c.count} items`;
      const more = c.waiting > c.count ? ` · ${c.waiting} waiting` : '';
      return `<div class="row"><div class="glyph">${APP_ICON}</div><div class="text">
          <div class="title">Waiting for iPhone</div><div class="sub">${esc(what)}${more}</div>
          <div class="sub">Open Grasp on your iPhone to receive</div></div></div>
        <div class="actions"><button id="hide-send">Hide</button><button id="cancel-send" class="reject">Cancel</button></div>`;
    }
    case 'outgoing': {
      const pct = pctOf(c.sent, c.total);
      return `<div class="row"><div class="glyph">${APP_ICON}</div><div class="text">
          <div class="title">iPhone</div><div class="sub">Sending ${esc(c.name)}…</div></div></div>
        <div class="barrow"><div class="bar" id="bar"><i style="width:${pct}%"></i></div>
          <button class="stop" id="stop-send" title="Cancel: nothing is kept on the iPhone" aria-label="Cancel">✕</button></div>
        <div class="meta"><span id="sz">${sizeLine(c.sent, c.total)}</span><span id="pct">${pct}%</span></div>`;
    }
    case 'sent':
      return `<div class="row"><div class="glyph">${CHECK}</div><div class="text">
          <div class="title">Sent to iPhone</div><div class="sub">${esc(c.summary)}</div></div></div>`;
  }
}

function render() {
  card.innerHTML = markup();
  card.onclick = null; // only the finished state sets one (after render)
  card.classList.toggle('clickable', current.kind === 'done');
  wire();
  // The window is transparent and sized to the card, so it never blocks clicks beneath it.
  invoke('toast_resize', { height: document.querySelector('.stage').offsetHeight });
  // Drops are caught by an invisible native window over the toast, only while the drop zone shows
  // (it would otherwise cover Accept / Reject).
  invoke('drop_overlay', { on: current.kind === 'dropzone' });
}

function wire() {
  const c = current;
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('accept', () => {
    invoke('respond', { id: c.id, accept: true });
    // A message is delivered instantly (the 'accepted-message' event replaces this card);
    // files start streaming and get a progress bar.
    current = c.req.message != null
      ? { ...c, accepted: true }
      : { kind: 'receiving', id: c.id, req: c.req, received: 0, total: c.req.total };
    render();
  });
  on('reject', () => { invoke('respond', { id: c.id, accept: false }); dismiss(); });
  on('cancel-send', () => { invoke('clear_outbox'); dismiss(); });
  on('hide-send', dismiss);
  // Cancel a transfer in either direction. Receiving: the PC deletes what already arrived. Sending: the
  // queue is cleared, the file stops mid-stream and the phone keeps nothing from this send.
  on('stop-receive', () => { invoke('cancel_receive', { id: c.id }); dismiss(); });
  on('stop-send', () => { invoke('clear_outbox'); dismiss(); });   // still queued: the tray menu shows it, and the phone collects it as usual
}

function autoDismiss(ms) {
  clearTimeout(timer);
  timer = setTimeout(dismiss, ms);
}

// Stays while the pointer is on the card (so Cancel can be reached), then leaves.
function hoverToStay(ms) {
  card.onmouseenter = () => clearTimeout(timer);
  card.onmouseleave = () => autoDismiss(2000);
  autoDismiss(ms);
}

// Replace what's on the card now, without the slide-out/slide-in.
function swap(item) {
  clearTimeout(timer);
  card.onmouseenter = card.onmouseleave = null;
  current = item;
  render();
}

async function present(item) {
  current = item;
  leaving = false;
  card.classList.remove('out');
  render();
  await invoke('toast_show');
  requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('in')));
  card.onmouseenter = card.onmouseleave = null;
  if (item.kind === 'failed') autoDismiss(6000);
  if (item.kind === 'paired' || item.kind === 'sent') autoDismiss(3800);
}

function dismiss() {
  if (!current || leaving) return;
  leaving = true;
  clearTimeout(timer);
  card.classList.remove('in');
  card.classList.add('out');
  setTimeout(async () => {
    await invoke('toast_hidden');
    current = null;
    leaving = false;
    card.classList.remove('out');
    const next = queue.shift();
    if (next) present(next);
  }, 300);
}

// Something new wants the card. Transfers cut in front of passive toasts; passive toasts wait for transfers.
const passive = (k) => ['copied', 'done', 'failed', 'paired', 'queued', 'sent', 'dropzone'].includes(k);

function show(item) {
  if (!current && !leaving) return present(item);
  if (leaving) return queue.push(item);
  if (['incoming', 'receiving', 'outgoing'].includes(item.kind) && passive(current.kind)) {
    clearTimeout(timer);
    current = item;
    render();
    return;
  }
  queue.push(item);
}

listen('incoming', ({ payload }) => show({ kind: 'incoming', id: payload.id, req: payload }));

// Windows -> iPhone. Files are being dragged somewhere: offer the drop zone unless a transfer owns the card.
listen('drag-start', () => {
  const zone = { kind: 'dropzone', id: 'dropzone' };
  if (!current && !leaving) return present(zone);
  if (current && passive(current.kind) && current.kind !== 'dropzone') swap(zone);
});
listen('drop-hover', ({ payload: on }) => document.getElementById('drop')?.classList.toggle('hover', on));
// Cleared from the tray menu: nothing is waiting any more.
listen('outbox-cleared', () => {
  queue = queue.filter((q) => q.kind !== 'queued');
  if (current?.kind === 'queued') dismiss();
});
listen('dropped', () => { if (current?.kind === 'dropzone') current.dropped = true; });
// Let go elsewhere: the zone goes. (A drop on it is replaced by the 'queued' card from the core.)
listen('drag-end', () => setTimeout(() => {
  if (current?.kind === 'dropzone' && !current.dropped) dismiss();
}, 250));

// A message the user accepted: the shell has already copied it (and opened it, if it was a web link).
listen('accepted-message', ({ payload: p }) => {
  if (!current || current.id !== p.id || !current.req) return;
  current = { kind: 'copied', id: p.id, text: current.req.message, copied: p.copied, opened: p.opened };
  render();
  card.onmouseenter = () => clearTimeout(timer);
  card.onmouseleave = () => autoDismiss(3000);
  autoDismiss(12000);
});

listen('ui', ({ payload: p }) => {
  switch (p.type) {
    // A paired iPhone with auto-accept on: no buttons, straight to progress (or, for a message,
    // a waiting card that 'accepted-message' replaces a moment later).
    case 'autoAccepted': {
      const req = p.request;
      show(req.message != null
        ? { kind: 'incoming', id: req.id, req, accepted: true }
        : { kind: 'receiving', id: req.id, req, received: 0, total: req.total });
      break;
    }
    case 'paired':
      show({ kind: 'paired', id: 'paired-' + p.device.fingerprint, name: p.device.alias });
      break;
    // The phone unpaired this PC itself (an unpair from this PC's window needs no toast).
    case 'unpaired':
      if (p.byPhone) show({ kind: 'paired', id: 'unpaired-' + p.device.fingerprint, title: 'Unpaired by the iPhone', name: p.device.alias });
      break;
    case 'progress':
      if (current && current.id === p.id && (current.kind === 'receiving' || current.kind === 'incoming')) {
        const wasIdle = current.kind !== 'receiving' || !current.received;
        if (current.kind === 'incoming') current = { kind: 'receiving', id: p.id, req: current.req };
        current.received = p.received; current.total = p.total;
        if (wasIdle) return render();
        const bar = document.querySelector('#bar > i'), pct = document.getElementById('pct'), sz = document.getElementById('sz');
        if (bar) bar.style.width = pctOf(p.received, p.total) + '%';
        if (pct) pct.textContent = pctOf(p.received, p.total) + '%';
        if (sz) sz.textContent = sizeLine(p.received, p.total);
      }
      break;
    case 'done':
      if (current && current.id === p.id) {
        const req = current.req;
        current = { kind: 'done', id: p.id, summary: req ? summarize(req.files, req.total) : `${p.count} files`, reveal: p.firstFile || p.dir };
        render();
        card.onclick = () => { invoke('reveal', { path: current.reveal }); dismiss(); };
        card.onmouseenter = () => clearTimeout(timer);
        card.onmouseleave = () => autoDismiss(1800);
        autoDismiss(3800);
      }
      break;
    case 'queued': {
      const item = { kind: 'queued', id: 'queued', count: p.count, waiting: p.waiting, first: p.first };
      // Stays until the phone starts collecting (becomes the progress card), Cancel, or Hide.
      if (current && (current.kind === 'dropzone' || current.kind === 'queued')) swap(item);
      else show(item);
      break;
    }
    case 'outboxProgress':
      if (current && current.kind === 'outgoing') {
        if (current.name !== p.name) return swap({ kind: 'outgoing', id: 'outbox', name: p.name, sent: p.sent, total: p.total });
        current.sent = p.sent; current.total = p.total;
        const bar = document.querySelector('#bar > i'), pct = document.getElementById('pct'), sz = document.getElementById('sz');
        if (bar) bar.style.width = pctOf(p.sent, p.total) + '%';
        if (pct) pct.textContent = pctOf(p.sent, p.total) + '%';
        if (sz) sz.textContent = sizeLine(p.sent, p.total);
      } else if (current && passive(current.kind)) {
        swap({ kind: 'outgoing', id: 'outbox', name: p.name, sent: p.sent, total: p.total });
      } else {
        show({ kind: 'outgoing', id: 'outbox', name: p.name, sent: p.sent, total: p.total });
      }
      break;
    case 'outboxDelivered': {
      delivered = { n: delivered.n + 1, last: p.text ? 'Text (copied on iPhone)' : p.name };
      if (p.remaining > 0) break;
      const sent = { kind: 'sent', id: 'sent', summary: delivered.n === 1 ? delivered.last : `${delivered.n} items` };
      delivered = { n: 0, last: '' };
      if (current && (current.kind === 'outgoing' || passive(current.kind))) { swap(sent); autoDismiss(3800); }
      else show(sent);
      break;
    }
    case 'cancelled':
      queue = queue.filter((q) => q.id !== p.id);
      if (current && current.id === p.id) dismiss();
      break;
    case 'failed':
      queue = queue.filter((q) => q.id !== p.id);
      const sending = /^(outbox|send)-/.test(p.id);
      if (current && current.id === p.id) {
        current = { kind: 'failed', id: p.id, reason: p.reason, sending };
        render();
        autoDismiss(6000);
      } else {
        show({ kind: 'failed', id: p.id, reason: p.reason, sending });
      }
      break;
  }
});
</script>
</body>
</html>
