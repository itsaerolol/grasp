name: Grasp
options:
  bundleIdPrefix: com.itsaerolol
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  swift-certificates:
    url: https://github.com/apple/swift-certificates
    from: 1.6.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto
    from: 3.10.0

settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Grasp:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: GraspShare
      - package: swift-certificates
        product: X509
      - package: swift-crypto
        product: _CryptoExtras
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itsaerolol.grasp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # App/Assets.xcassets/AppIcon, generated from the repo's icon.png (windows/scripts/make-icons.ps1).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Grasp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Grasp finds and sends files to your PC on this network.
        # Windows -> iPhone: received files live in Documents, shown in Files > On My iPhone > Grasp.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: Grasp saves photos and videos you send from your PC to your library.
        NSUserActivityTypes:
          - INSendMessageIntent
    entitlements:
      path: App/Grasp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.itsaerolol.grasp

  GraspShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    dependencies:
      - package: swift-certificates
        product: X509
      - package: swift-crypto
        product: _CryptoExtras
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itsaerolol.grasp.share
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Grasp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Grasp sends shared items to your PC on this network.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            IntentsSupported:
              - INSendMessageIntent
            # Any number of items of any kind (photos, videos, files, folders, links, text): like AirDrop,
            # no count cap. public.item is the root type, so nothing is excluded; folders are zipped.
            # (A predicate is the only way to lift the per-type max counts.)
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $a,
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.item"
              ).@count >= 1).@count >= 1
    entitlements:
      path: ShareExtension/GraspShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.itsaerolol.grasp

  GraspTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared
    dependencies:
      - package: swift-certificates
        product: X509
      - package: swift-crypto
        product: _CryptoExtras
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itsaerolol.grasp.tests
        GENERATE_INFOPLIST_FILE: YES
